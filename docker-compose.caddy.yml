services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      # PWA для iOS (luzalerts.lat/app): сюда кладется `expo export -p web`,
      # см. scripts/deploy-pwa.sh
      - ./app-web:/srv/app-web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
