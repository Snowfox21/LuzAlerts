services:
  db:
    image: postgis/postgis:16-3.4
    container_name: luzalerts_db
    environment:
      POSTGRES_USER: luz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luz}
      POSTGRES_DB: luzalerts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U luz -d luzalerts" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: luzalerts_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://luz:luz@db:5432/luzalerts}
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-dev@luzalerts.local}
      REPORT_RADIUS_M: 500
      REPORT_THRESHOLD: 3
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: luzalerts_scraper
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://luz:luz@db:5432/luzalerts}
      ANDE_URL: https://www.ande.gov.py/
      POLL_INTERVAL_MINUTES: 240
      PYTHONUNBUFFERED: "1"
      # SOCKS proxy for ANDE requests. ande.gov.py (Radware) blocks the datacenter
      # IP with a CAPTCHA, so the scraper egresses through a residential reverse-SSH
      # tunnel bound to the docker bridge gateway. Empty → no proxy (direct).
      WEBSHARE_PROXY: ${WEBSHARE_PROXY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
