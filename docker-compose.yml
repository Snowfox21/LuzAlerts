services:
  db:
    image: postgis/postgis:16-3.4
    container_name: luzalerts_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: luz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luz}
      POSTGRES_DB: luzalerts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U luz -d luzalerts" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: luzalerts_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://luz:luz@db:5432/luzalerts}
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-dev@luzalerts.local}
      REPORT_RADIUS_M: 500
      REPORT_THRESHOLD: 3
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: luzalerts_scraper
    restart: unless-stopped
    # Run a real init (tini) as PID 1. The CMD is `xvfb-run … python main.py`, and
    # xvfb-run waits for a SIGUSR1 readiness signal from Xvfb — but the kernel does
    # NOT deliver signals to a PID 1 that lacks an explicit handler, so as PID 1
    # xvfb-run hangs forever on that wait and python never starts (container shows
    # "Up" but does nothing). With init:true, xvfb-run runs as a child and signals
    # work normally. tini also reaps the Chromium/Xvfb zombies each run leaves.
    init: true
    labels:
      # Watched by the autoheal sidecar: when the healthcheck (heartbeat
      # freshness, see scraper/Dockerfile) reports unhealthy, autoheal restarts
      # this container. Needed because the scraper once died while its xvfb-run
      # wrapper kept the container "Up", so restart:unless-stopped alone never
      # fired.
      autoheal: "true"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://luz:luz@db:5432/luzalerts}
      ANDE_URL: https://www.ande.gov.py/
      POLL_INTERVAL_MINUTES: 240
      PYTHONUNBUFFERED: "1"
      # Primary ANDE egress. patchright passes the Radware JS challenge from the
      # plain datacenter IP, so this is normally empty (direct) — no tunnel
      # dependency in steady state. Set only to force all egress through a proxy.
      WEBSHARE_PROXY: ${WEBSHARE_PROXY:-}
      # Fallback egress: a residential SOCKS tunnel (reverse-SSH on the docker
      # bridge gateway, Paraguay IP). Used ONLY when direct egress returns nothing
      # because Radware flagged the datacenter IP (happens under bursty load).
      # This keeps the tunnel a safety net, not a single point of failure.
      ANDE_FALLBACK_PROXY: ${ANDE_FALLBACK_PROXY:-socks5://172.18.0.1:1080}
      # Persisted browser profile dir (see volume below) so the Radware clearance
      # cookie survives container restarts and most runs skip the cold challenge.
      ANDE_PROFILE_DIR: /profiles/ande
    volumes:
      - ande_profiles:/profiles
    depends_on:
      db:
        condition: service_healthy

  # Restarts any container marked `autoheal: "true"` when Docker reports it
  # unhealthy. Tiny (~10MB); only needs the Docker socket to issue restarts.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: luzalerts_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  ande_profiles:
